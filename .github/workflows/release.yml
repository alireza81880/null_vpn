name: Build & Release Null VPN

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build & Package Electron (.exe)
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Null-VPN-Windows-Exe
          path: release/*.exe

      - name: Upload Release Asset (For Tag Pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download sing-box-lx libbox.aar (v1.14.1-lx.8)
        run: |
          mkdir -p android/app/libs
          AAR_URL="https://github.com/Leadaxe/sing-box-lx/releases/download/v1.14.1-lx.8/libbox-1.14.1-lx.8.aar"
          EXPECTED_SHA256="beab998c9d0a46826db0d654b5315fa6a25d9e1cbf8cb10c547e757444c26d80"
          
          echo "Downloading $AAR_URL..."
          curl -sL "$AAR_URL" -o "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"
          
          echo "$EXPECTED_SHA256  $GITHUB_WORKSPACE/android/app/libs/libbox.aar" | sha256sum -c -
          ls -lh "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"

      - name: Setup Java (JDK 21 for Capacitor & Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build React Frontend
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons
        run: |
          npm run generate-assets
          npx cap sync android

      - name: Preflight Native Validation (sing-box-lx & Architecture Check)
        run: |
          echo "=== Preflight Native Validation ==="
          
          # 1. Check libbox.aar presence and non-zero size
          if [ ! -s "android/app/libs/libbox.aar" ]; then
            echo "ERROR: android/app/libs/libbox.aar is missing or empty!"
            exit 1
          fi
          echo "✔ libbox.aar exists ($(du -h android/app/libs/libbox.aar | cut -f1))"

          # 2. Inspect classes inside AAR for CommandServer and PlatformInterface
          unzip -p android/app/libs/libbox.aar classes.jar > /tmp/classes.jar
          if [ ! -s /tmp/classes.jar ]; then
            echo "ERROR: Failed to extract classes.jar from libbox.aar"
            exit 1
          fi

          if unzip -l /tmp/classes.jar | grep -q "io/nekohasekai/libbox/CommandServer.class"; then
            echo "✔ io.nekohasekai.libbox.CommandServer verified"
          else
            echo "ERROR: io.nekohasekai.libbox.CommandServer missing from libbox.aar"
            exit 1
          fi

          if unzip -l /tmp/classes.jar | grep -q "io/nekohasekai/libbox/PlatformInterface.class"; then
            echo "✔ io.nekohasekai.libbox.PlatformInterface verified"
          else
            echo "ERROR: io.nekohasekai.libbox.PlatformInterface missing from libbox.aar"
            exit 1
          fi

          # 3. Check JNI architectures packaged inside AAR
          echo "Packaged JNI architectures inside AAR:"
          unzip -l android/app/libs/libbox.aar | grep "jni/" | awk '{print $NF}'

          # 4. Check ndk abiFilters in build.gradle
          grep -A 3 "abiFilters" android/app/build.gradle
          echo "✔ Architecture configuration verified"

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Auto-Sign Release APK
        run: |
          # ساخت کلید موقت و امضای دیجیتال
          keytool -genkey -v -keystore release.keystore -alias nullvpn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Null VPN, O=Null, C=IR" -storepass nullvpn2026 -keypass nullvpn2026
          
          # پیدا کردن ابزار امضای اندروید
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          
          # امضای فایل
          $APKSIGNER sign --ks release.keystore --ks-key-alias nullvpn --ks-pass pass:nullvpn2026 --key-pass pass:nullvpn2026 android/app/build/outputs/apk/release/app-release-unsigned.apk
          
          # تغییر نام فایل نهایی
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Null-VPN-Release.apk

      - name: Upload Android Artifact (For Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Null-VPN-Android-Release-APK
          path: android/app/build/outputs/apk/release/Null-VPN-Release.apk

      - name: Upload Release Asset (For Tag Pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/Null-VPN-Release.apk
