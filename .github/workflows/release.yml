name: Build & Release Null VPN

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build & Package Electron (.exe)
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Null-VPN-Windows-Exe
          path: release/*.exe

      - name: Upload Release Asset (For Tag Pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go (For sing-box Native Core)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Official sing-box libbox.aar (v1.10.7)
        run: |
          mkdir -p android/app/libs
          LIBBOX_VER="v1.10.7"
          echo "Cloning official sing-box source at $LIBBOX_VER..."
          rm -rf /tmp/sing-box
          git clone --depth 1 --branch "$LIBBOX_VER" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          
          echo "Installing official sing-box libbox toolchain prerequisites (make lib_install)..."
          make lib_install
          
          echo "Building libbox.aar using official sing-box build tool (make lib_android)..."
          make lib_android
          
          test -s libbox.aar || exit 1
          cp libbox.aar "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"
          test -s "$GITHUB_WORKSPACE/android/app/libs/libbox.aar" || exit 1
          
          echo "SUCCESS: Official sing-box libbox.aar generated and verified:"
          ls -lh "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"

      - name: Install Dependencies
        run: npm install

      - name: Build React Frontend
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons
        run: |
          npm run generate-assets
          npx cap sync android
      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Auto-Sign Release APK
        run: |
          # ساخت کلید موقت و امضای دیجیتال
          keytool -genkey -v -keystore release.keystore -alias nullvpn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Null VPN, O=Null, C=IR" -storepass nullvpn2026 -keypass nullvpn2026
          
          # پیدا کردن ابزار امضای اندروید
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1)
          
          # امضای فایل
          $APKSIGNER sign --ks release.keystore --ks-key-alias nullvpn --ks-pass pass:nullvpn2026 --key-pass pass:nullvpn2026 android/app/build/outputs/apk/release/app-release-unsigned.apk
          
          # تغییر نام فایل نهایی
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Null-VPN-Release.apk

      - name: Upload Android Artifact (For Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Null-VPN-Android-Release-APK
          path: android/app/build/outputs/apk/release/Null-VPN-Release.apk

      - name: Upload Release Asset (For Tag Pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/Null-VPN-Release.apk
